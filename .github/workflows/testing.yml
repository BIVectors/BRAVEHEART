# Run BRAVEHEART Tests during any commit to make sure passes
name: BRAVEHEART Tests

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "braveheart_test"
  braveheart_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: >
            Wavelet_Toolbox
            Signal_Processing_Toolbox
            Deep_Learning_Toolbox
      - name: Run BRAVEHEART tests
        uses: matlab-actions/run-tests@v3
        with:
          output-detail: detailed
